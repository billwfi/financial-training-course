<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Builder — Financial Fundamentals</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <style>
    body { background: var(--gray-50); }

    /* ── Header ───────────────────────────────────────── */
    .builder-header {
      background: var(--navy);
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 28px;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .builder-header h1 { font-size: 1rem; color: var(--white); flex: 1; }
    .builder-header a { color: var(--gray-300); font-size: 0.85rem; }
    .builder-header a:hover { color: var(--white); }
    .unsaved-dot {
      width: 8px; height: 8px;
      background: var(--gold);
      border-radius: 50%;
      display: none;
    }
    .unsaved-dot.visible { display: inline-block; }

    /* ── Layout ───────────────────────────────────────── */
    .builder-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: calc(100vh - 58px);
    }

    /* ── Left panel ───────────────────────────────────── */
    .builder-left {
      background: var(--white);
      border-right: 1px solid var(--gray-200);
      overflow-y: auto;
      position: sticky;
      top: 58px;
      height: calc(100vh - 58px);
      display: flex;
      flex-direction: column;
    }
    .panel-section {
      border-bottom: 1px solid var(--gray-100);
      padding: 20px;
    }
    .panel-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gray-500);
      margin-bottom: 14px;
    }

    /* Course info card in left panel */
    .course-info-summary {
      font-size: 0.88rem;
      cursor: pointer;
      padding: 12px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      transition: all var(--transition);
    }
    .course-info-summary:hover { border-color: var(--gold); }
    .course-info-summary.active { border-color: var(--gold); background: var(--gold-pale); }
    .course-info-name { font-weight: 700; font-size: 0.9rem; color: var(--navy); }
    .course-info-meta { color: var(--gray-500); font-size: 0.8rem; margin-top: 4px; }

    /* Modules in left panel */
    .modules-panel { flex: 1; overflow-y: auto; padding: 16px; }
    .module-panel-item {
      background: var(--gray-50);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .module-panel-item.active { border-color: var(--gold); }
    .module-panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      cursor: pointer;
    }
    .module-panel-header:hover { background: var(--gray-100); }
    .module-drag-handle { color: var(--gray-300); cursor: grab; font-size: 0.9rem; }
    .module-panel-title { font-size: 0.88rem; font-weight: 700; flex: 1; color: var(--navy); }
    .module-panel-actions { display: flex; gap: 4px; }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px;
      border-radius: 4px;
      color: var(--gray-500);
      transition: all var(--transition);
    }
    .icon-btn:hover { background: var(--gray-200); color: var(--gray-900); }
    .icon-btn.del:hover { background: var(--red-pale); color: var(--red); }

    .module-panel-lessons { border-top: 1px solid var(--gray-200); background: var(--white); display: none; }
    .module-panel-item.open .module-panel-lessons { display: block; }
    .module-panel-chevron { transition: transform var(--transition); color: var(--gray-400); font-size: 0.8rem; }
    .module-panel-item.open .module-panel-chevron { transform: rotate(180deg); }

    .lesson-panel-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--gray-100);
      transition: background var(--transition);
    }
    .lesson-panel-item:hover { background: var(--gray-50); }
    .lesson-panel-item.active { background: var(--gold-pale); font-weight: 600; }
    .lesson-panel-item:last-child { border-bottom: none; }
    .add-lesson-btn {
      padding: 8px 14px;
      font-size: 0.82rem;
      color: var(--gray-500);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px dashed var(--gray-200);
      background: none;
      width: 100%;
      text-align: left;
    }
    .add-lesson-btn:hover { background: var(--gray-50); color: var(--navy); }

    .add-module-btn {
      margin: 16px;
      width: calc(100% - 32px);
      padding: 10px;
      border: 2px dashed var(--gray-300);
      background: none;
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--gray-500);
      font-size: 0.88rem;
      font-weight: 600;
      transition: all var(--transition);
    }
    .add-module-btn:hover { border-color: var(--gold); color: var(--navy); background: var(--gold-pale); }

    /* ── Right editor panel ───────────────────────────── */
    .builder-right { padding: 32px; max-width: 820px; }

    .editor-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 40px;
      text-align: center;
      color: var(--gray-500);
    }
    .editor-empty-icon { font-size: 3rem; margin-bottom: 16px; }

    .editor-section { margin-bottom: 32px; }
    .editor-section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--navy);
      padding-bottom: 10px;
      border-bottom: 2px solid var(--gray-200);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* YouTube preview */
    .yt-preview {
      position: relative;
      padding-bottom: 30%;
      background: var(--gray-900);
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 10px;
    }
    .yt-preview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    .yt-preview-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray-500);
      font-size: 0.9rem;
      gap: 8px;
    }

    /* Resources editor */
    .resources-editor { display: flex; flex-direction: column; gap: 10px; }
    .resource-row {
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--white);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 10px 14px;
    }
    .resource-row .form-control { margin: 0; }

    /* Quiz editor */
    .quiz-editor { display: flex; flex-direction: column; gap: 16px; }
    .quiz-q-editor {
      background: var(--white);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .quiz-q-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .quiz-q-label { font-weight: 700; font-size: 0.9rem; color: var(--navy); }
    .quiz-option-row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
    .quiz-option-row label { font-size: 0.82rem; font-weight: 600; width: 24px; text-align: center; color: var(--gray-500); }
    .correct-radio { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }

    /* Wheel of Life section in course editor */
    .wol-hint {
      background: var(--gold-pale);
      border: 1px solid var(--gold);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 0.85rem;
      color: var(--navy);
      margin-bottom: 16px;
    }

    /* Tags for wheel spoke association */
    .spoke-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .spoke-tag {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--gray-200);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--gray-700);
      transition: all var(--transition);
    }
    .spoke-tag.selected { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .spoke-tag:hover:not(.selected) { border-color: var(--navy); color: var(--navy); }

    @media (max-width: 900px) {
      .builder-layout { grid-template-columns: 1fr; }
      .builder-left { position: relative; height: auto; }
      .builder-right { padding: 16px; }
    }
  </style>
</head>
<body>

<header class="builder-header">
  <a href="../index.html">← Preview Site</a>
  <h1>Course Builder</h1>
  <span class="unsaved-dot" id="unsaved-dot" title="Unsaved changes"></span>
  <div style="display:flex;gap:10px;align-items:center;">
    <a href="../course.html" target="_blank" style="font-size:0.85rem;">Preview LMS ↗</a>
    <button class="btn btn-primary btn-sm" onclick="saveCourse()" id="save-btn">Save</button>
  </div>
</header>

<div class="builder-layout">
  <!-- Left: structure panel -->
  <aside class="builder-left" id="builder-left">
    <div class="panel-section">
      <div class="panel-section-title">Course</div>
      <div class="course-info-summary" id="course-info-card" onclick="editCourseInfo()">
        <div class="course-info-name" id="panel-course-title">Loading…</div>
        <div class="course-info-meta" id="panel-course-meta"></div>
      </div>
    </div>
    <div class="panel-section" style="border-bottom:none;flex:1;overflow-y:auto;padding:0;">
      <div style="padding:16px 20px 8px;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--gray-500);">Modules</div>
      <div id="modules-panel"></div>
      <button class="add-module-btn" onclick="addModule()">+ Add Module</button>
    </div>
  </aside>

  <!-- Right: editor -->
  <main class="builder-right" id="builder-right">
    <div class="editor-empty">
      <div class="editor-empty-icon">🏗️</div>
      <h3>Select something to edit</h3>
      <p style="color:var(--gray-500);margin-top:8px;">Click the course title, a module, or a lesson on the left to start editing.</p>
    </div>
  </main>
</div>

<div id="toast"></div>

<!-- ── Modal ───────────────────────────────────────────────────── -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;display:none;align-items:center;justify-content:center;" onclick="closeModal(event)">
  <div id="modal-box" style="background:var(--white);border-radius:var(--radius-lg);padding:32px;max-width:480px;width:90%;box-shadow:var(--shadow-lg);" onclick="event.stopPropagation()">
    <div id="modal-content"></div>
  </div>
</div>

<script>
let course = null;
let isDirty = false;
let activeEditor = null; // { type: 'course' | 'module' | 'lesson', modId?, lesId? }

async function init() {
  try {
    const res = await fetch('/api/course');
    course = await res.json();
    renderLeft();
    editCourseInfo();
  } catch (err) {
    document.getElementById('builder-right').innerHTML = `<p style="color:var(--red);padding:40px;">Failed to load. Is Netlify Dev running?</p>`;
  }
}

function markDirty() {
  isDirty = true;
  document.getElementById('unsaved-dot').classList.add('visible');
}

async function saveCourse() {
  const btn = document.getElementById('save-btn');
  btn.textContent = 'Saving…';
  btn.disabled = true;
  try {
    const res = await fetch('/api/course', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(course)
    });
    if (!res.ok) throw new Error('Save failed');
    isDirty = false;
    document.getElementById('unsaved-dot').classList.remove('visible');
    showToast('Course saved!', 'success');
  } catch {
    showToast('Save failed. Check console.', 'error');
  } finally {
    btn.textContent = 'Save';
    btn.disabled = false;
  }
}

/* ── Left panel rendering ────────────────────────────────────── */

function renderLeft() {
  document.getElementById('panel-course-title').textContent = course.title;
  document.getElementById('panel-course-meta').textContent =
    `${course.modules.length} module${course.modules.length !== 1 ? 's' : ''} · ${course.modules.reduce((a,m)=>a+m.lessons.length,0)} lessons`;

  const panel = document.getElementById('modules-panel');
  if (!course.modules.length) {
    panel.innerHTML = '<p style="padding:12px 20px;color:var(--gray-500);font-size:0.85rem;">No modules yet.</p>';
    return;
  }
  panel.innerHTML = course.modules.map(mod => `
    <div class="module-panel-item ${activeEditor?.modId === mod.id ? 'active open' : ''}" id="mpanel-${mod.id}">
      <div class="module-panel-header">
        <span class="module-drag-handle" title="Drag to reorder">⠿</span>
        <span class="module-panel-title" onclick="editModule('${mod.id}')">${esc(mod.title)}</span>
        <div class="module-panel-actions">
          <button class="icon-btn del" onclick="deleteModule('${mod.id}')" title="Delete module">🗑</button>
          <button class="icon-btn module-panel-chevron" onclick="toggleModulePanel('${mod.id}')">▾</button>
        </div>
      </div>
      <div class="module-panel-lessons">
        ${mod.lessons.map(les => `
          <div class="lesson-panel-item ${activeEditor?.lesId === les.id ? 'active' : ''}" id="lpanel-${les.id}" onclick="editLesson('${mod.id}','${les.id}')">
            <span style="color:var(--gray-300);">📄</span>
            <span style="flex:1">${esc(les.title)}</span>
            <button class="icon-btn del" onclick="event.stopPropagation();deleteLesson('${mod.id}','${les.id}')" title="Delete lesson">🗑</button>
          </div>
        `).join('')}
        <button class="add-lesson-btn" onclick="addLesson('${mod.id}')">＋ Add Lesson</button>
      </div>
    </div>
  `).join('');

  // Re-open active module
  if (activeEditor?.modId) {
    const el = document.getElementById('mpanel-' + activeEditor.modId);
    if (el) el.classList.add('open');
  }
}

function toggleModulePanel(modId) {
  const el = document.getElementById('mpanel-' + modId);
  el.classList.toggle('open');
}

/* ── Course Info editor ──────────────────────────────────────── */

function editCourseInfo() {
  activeEditor = { type: 'course' };
  document.getElementById('course-info-card').classList.add('active');
  document.querySelectorAll('.module-panel-item').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.lesson-panel-item').forEach(e => e.classList.remove('active'));

  document.getElementById('builder-right').innerHTML = `
    <h2 style="margin-bottom:24px;font-size:1.3rem;">Course Settings</h2>

    <div class="editor-section">
      <div class="editor-section-title">Basic Info</div>
      <div class="form-group">
        <label>Course Title</label>
        <input type="text" class="form-control" id="ci-title" value="${esc(course.title)}" oninput="patchCourse('title',this.value)" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea class="form-control" id="ci-desc" rows="4" oninput="patchCourse('description',this.value)">${esc(course.description)}</textarea>
      </div>
      <div class="form-group">
        <label>Thumbnail Image URL</label>
        <input type="url" class="form-control" id="ci-thumb" value="${esc(course.thumbnail || '')}" oninput="patchCourse('thumbnail',this.value)" placeholder="https://..." />
      </div>
      <div class="form-group">
        <label>Preview Video YouTube ID</label>
        <input type="text" class="form-control" id="ci-previewvid" value="${esc(course.previewVideoId || '')}" oninput="patchCourse('previewVideoId',this.value)" placeholder="e.g. dQw4w9WgXcQ" />
        <div class="yt-preview" style="margin-top:10px;" id="ci-preview-wrap">
          ${course.previewVideoId
            ? `<iframe src="https://www.youtube.com/embed/${esc(course.previewVideoId)}" allowfullscreen></iframe>`
            : `<div class="yt-preview-placeholder">🎬 Enter a YouTube ID above</div>`}
        </div>
      </div>
    </div>

    <div class="editor-section">
      <div class="editor-section-title">Instructor</div>
      <div class="form-group">
        <label>Name</label>
        <input type="text" class="form-control" value="${esc(course.instructor.name)}" oninput="patchInstructor('name',this.value)" />
      </div>
      <div class="form-group">
        <label>Title / Credentials</label>
        <input type="text" class="form-control" value="${esc(course.instructor.title)}" oninput="patchInstructor('title',this.value)" />
      </div>
      <div class="form-group">
        <label>Bio</label>
        <textarea class="form-control" rows="3" oninput="patchInstructor('bio',this.value)">${esc(course.instructor.bio)}</textarea>
      </div>
      <div class="form-group">
        <label>Avatar / Photo URL</label>
        <input type="url" class="form-control" value="${esc(course.instructor.avatarUrl || '')}" oninput="patchInstructor('avatarUrl',this.value)" placeholder="https://..." />
      </div>
    </div>

    <div class="editor-section">
      <div class="editor-section-title">Wheel of Life</div>
      <div class="wol-hint">
        💡 The Wheel of Life framework is already embedded in your seed content. Use this section to remind learners which life areas each module connects to. Assign wheel spokes to modules and lessons for visual reinforcement.
      </div>
      <p style="font-size:0.9rem;color:var(--gray-500);">Wheel spoke associations are set per-module and per-lesson in the editor. The landing page always shows all 8 spokes.</p>
    </div>
  `;
}

function patchCourse(field, value) {
  course[field] = value;
  markDirty();
  if (field === 'title') document.getElementById('panel-course-title').textContent = value;
  if (field === 'previewVideoId') {
    const wrap = document.getElementById('ci-preview-wrap');
    if (wrap) wrap.innerHTML = value
      ? `<iframe src="https://www.youtube.com/embed/${esc(value)}" allowfullscreen></iframe>`
      : `<div class="yt-preview-placeholder">🎬 Enter a YouTube ID above</div>`;
  }
}

function patchInstructor(field, value) {
  course.instructor[field] = value;
  markDirty();
}

/* ── Module editor ───────────────────────────────────────────── */

function editModule(modId) {
  const mod = course.modules.find(m => m.id === modId);
  activeEditor = { type: 'module', modId };
  renderLeft();
  toggleModulePanel(modId);

  const WOL_SPOKES = ['Career & Work','Money & Finances','Health & Fitness','Family & Friends','Romance & Partnership','Personal Growth','Fun & Recreation','Physical Environment'];

  document.getElementById('builder-right').innerHTML = `
    <h2 style="margin-bottom:4px;font-size:1.2rem;">Edit Module</h2>
    <p style="color:var(--gray-500);font-size:0.88rem;margin-bottom:24px;">Changes auto-apply to the left panel.</p>

    <div class="editor-section">
      <div class="editor-section-title">Module Details</div>
      <div class="form-group">
        <label>Module Title</label>
        <input type="text" class="form-control" value="${esc(mod.title)}" oninput="patchModule('${modId}','title',this.value)" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea class="form-control" rows="3" oninput="patchModule('${modId}','description',this.value)">${esc(mod.description)}</textarea>
      </div>
    </div>

    <div class="editor-section">
      <div class="editor-section-title">Wheel of Life Connection</div>
      <p style="font-size:0.85rem;color:var(--gray-500);margin-bottom:12px;">Which life area(s) does this module primarily address?</p>
      <div class="spoke-tags" id="module-spokes">
        ${WOL_SPOKES.map(s => `
          <div class="spoke-tag ${(mod.wheelSpokes||[]).includes(s)?'selected':''}" onclick="toggleModuleSpoke('${modId}','${s}',this)">${s}</div>
        `).join('')}
      </div>
    </div>

    <div style="display:flex;gap:12px;margin-top:12px;">
      <button class="btn btn-navy" onclick="addLesson('${modId}')">+ Add Lesson to This Module</button>
      <button class="btn btn-danger btn-sm" onclick="deleteModule('${modId}')">Delete Module</button>
    </div>
  `;
}

function patchModule(modId, field, value) {
  const mod = course.modules.find(m => m.id === modId);
  mod[field] = value;
  markDirty();
  const el = document.querySelector(`#mpanel-${modId} .module-panel-title`);
  if (el) el.textContent = value;
}

function toggleModuleSpoke(modId, spoke, el) {
  const mod = course.modules.find(m => m.id === modId);
  if (!mod.wheelSpokes) mod.wheelSpokes = [];
  const idx = mod.wheelSpokes.indexOf(spoke);
  if (idx > -1) { mod.wheelSpokes.splice(idx, 1); el.classList.remove('selected'); }
  else { mod.wheelSpokes.push(spoke); el.classList.add('selected'); }
  markDirty();
}

/* ── Lesson editor ───────────────────────────────────────────── */

function editLesson(modId, lesId) {
  const mod = course.modules.find(m => m.id === modId);
  const les = mod.lessons.find(l => l.id === lesId);
  activeEditor = { type: 'lesson', modId, lesId };
  renderLeft();

  const WOL_SPOKES = ['Career & Work','Money & Finances','Health & Fitness','Family & Friends','Romance & Partnership','Personal Growth','Fun & Recreation','Physical Environment'];

  document.getElementById('builder-right').innerHTML = `
    <h2 style="margin-bottom:4px;font-size:1.2rem;">Edit Lesson</h2>
    <p style="color:var(--gray-500);font-size:0.88rem;margin-bottom:24px;">in <strong>${esc(mod.title)}</strong></p>

    <!-- Basic -->
    <div class="editor-section">
      <div class="editor-section-title">Lesson Details</div>
      <div class="form-group">
        <label>Lesson Title</label>
        <input type="text" class="form-control" value="${esc(les.title)}" oninput="patchLesson('${modId}','${lesId}','title',this.value)" />
      </div>
      <div class="form-group">
        <label>Description / Summary</label>
        <textarea class="form-control" rows="2" oninput="patchLesson('${modId}','${lesId}','description',this.value)">${esc(les.description)}</textarea>
      </div>
    </div>

    <!-- Video -->
    <div class="editor-section">
      <div class="editor-section-title">YouTube Video</div>
      <div class="form-group">
        <label>YouTube Video URL or ID</label>
        <input type="text" class="form-control" id="yt-input" value="${esc(les.youtubeId || '')}" oninput="handleYtInput('${modId}','${lesId}',this.value)" placeholder="Paste full URL or just the video ID" />
        <div style="font-size:0.8rem;color:var(--gray-500);margin-top:4px;">e.g. https://youtu.be/abc123 or just abc123</div>
      </div>
      <div class="yt-preview" id="yt-preview">
        ${les.youtubeId
          ? `<iframe src="https://www.youtube.com/embed/${esc(les.youtubeId)}" allowfullscreen></iframe>`
          : `<div class="yt-preview-placeholder">🎬 Paste a YouTube URL above</div>`}
      </div>
    </div>

    <!-- Notes -->
    <div class="editor-section">
      <div class="editor-section-title">Lesson Notes / Transcript</div>
      <div class="form-group">
        <textarea class="form-control" rows="8" id="notes-ta" oninput="patchLesson('${modId}','${lesId}','notes',this.value)">${esc(les.notes || '')}</textarea>
        <div style="font-size:0.8rem;color:var(--gray-500);margin-top:4px;">Supports **bold** markdown. Shown below the video in the LMS.</div>
      </div>
    </div>

    <!-- Resources -->
    <div class="editor-section">
      <div class="editor-section-title">
        Downloadable Resources
        <button class="btn btn-sm btn-ghost" onclick="addResource('${modId}','${lesId}')">+ Add Resource</button>
      </div>
      <div class="resources-editor" id="resources-editor-${lesId}">
        ${renderResourcesEditor(mod, les)}
      </div>
    </div>

    <!-- Wheel of Life -->
    <div class="editor-section">
      <div class="editor-section-title">Wheel of Life Connection</div>
      <div class="spoke-tags" id="lesson-spokes">
        ${WOL_SPOKES.map(s => `
          <div class="spoke-tag ${(les.wheelSpokes||[]).includes(s)?'selected':''}" onclick="toggleLessonSpoke('${modId}','${lesId}','${s}',this)">${s}</div>
        `).join('')}
      </div>
    </div>

    <!-- Quiz -->
    <div class="editor-section">
      <div class="editor-section-title">
        Knowledge Check / Quiz
        <button class="btn btn-sm btn-ghost" onclick="addQuestion('${modId}','${lesId}')">+ Add Question</button>
      </div>
      <div class="quiz-editor" id="quiz-editor-${lesId}">
        ${renderQuizEditor(mod, les)}
      </div>
    </div>

    <div style="display:flex;gap:12px;margin-top:8px;">
      <button class="btn btn-danger btn-sm" onclick="deleteLesson('${modId}','${lesId}')">Delete Lesson</button>
    </div>
  `;
}

function patchLesson(modId, lesId, field, value) {
  const les = course.modules.find(m => m.id === modId).lessons.find(l => l.id === lesId);
  les[field] = value;
  markDirty();
  if (field === 'title') {
    const el = document.getElementById('lpanel-' + lesId);
    if (el) el.querySelector('span:nth-child(2)').textContent = value;
  }
}

function handleYtInput(modId, lesId, raw) {
  let id = raw.trim();
  // Extract ID from various YouTube URL formats
  const patterns = [
    /youtu\.be\/([A-Za-z0-9_-]{11})/,
    /youtube\.com\/watch\?v=([A-Za-z0-9_-]{11})/,
    /youtube\.com\/embed\/([A-Za-z0-9_-]{11})/,
    /^([A-Za-z0-9_-]{11})$/
  ];
  for (const p of patterns) {
    const m = id.match(p);
    if (m) { id = m[1]; break; }
  }
  patchLesson(modId, lesId, 'youtubeId', id);
  const preview = document.getElementById('yt-preview');
  if (preview) {
    preview.innerHTML = id.length === 11
      ? `<iframe src="https://www.youtube.com/embed/${esc(id)}" allowfullscreen></iframe>`
      : `<div class="yt-preview-placeholder">🎬 Paste a YouTube URL above</div>`;
  }
}

function toggleLessonSpoke(modId, lesId, spoke, el) {
  const les = course.modules.find(m => m.id === modId).lessons.find(l => l.id === lesId);
  if (!les.wheelSpokes) les.wheelSpokes = [];
  const idx = les.wheelSpokes.indexOf(spoke);
  if (idx > -1) { les.wheelSpokes.splice(idx, 1); el.classList.remove('selected'); }
  else { les.wheelSpokes.push(spoke); el.classList.add('selected'); }
  markDirty();
}

/* ── Resources ───────────────────────────────────────────────── */

function renderResourcesEditor(mod, les) {
  if (!les.resources || !les.resources.length) {
    return '<p style="color:var(--gray-500);font-size:0.88rem;">No resources yet. Click + Add Resource above.</p>';
  }
  return les.resources.map((r, i) => `
    <div class="resource-row" id="res-row-${r.id}">
      <input type="text" class="form-control" style="flex:2" placeholder="Resource title" value="${esc(r.title)}"
        oninput="patchResource('${mod.id}','${les.id}','${r.id}','title',this.value)" />
      <input type="url" class="form-control" style="flex:3" placeholder="URL (leave blank = coming soon)" value="${esc(r.url || '')}"
        oninput="patchResource('${mod.id}','${les.id}','${r.id}','url',this.value)" />
      <button class="icon-btn del" onclick="deleteResource('${mod.id}','${les.id}','${r.id}')">🗑</button>
    </div>
  `).join('');
}

function addResource(modId, lesId) {
  const les = course.modules.find(m => m.id === modId).lessons.find(l => l.id === lesId);
  if (!les.resources) les.resources = [];
  les.resources.push({ id: uid(), title: 'New Resource', url: '' });
  markDirty();
  const mod = course.modules.find(m => m.id === modId);
  document.getElementById('resources-editor-' + lesId).innerHTML = renderResourcesEditor(mod, les);
}

function patchResource(modId, lesId, resId, field, value) {
  const les = course.modules.find(m => m.id === modId).lessons.find(l => l.id === lesId);
  const res = les.resources.find(r => r.id === resId);
  if (res) { res[field] = value; markDirty(); }
}

function deleteResource(modId, lesId, resId) {
  const les = course.modules.find(m => m.id === modId).lessons.find(l => l.id === lesId);
  les.resources = les.resources.filter(r => r.id !== resId);
  markDirty();
  const mod = course.modules.find(m => m.id === modId);
  document.getElementById('resources-editor-' + lesId).innerHTML = renderResourcesEditor(mod, les);
}

/* ── Quiz ────────────────────────────────────────────────────── */

function renderQuizEditor(mod, les) {
  if (!les.quiz || !les.quiz.questions || !les.quiz.questions.length) {
    return '<p style="color:var(--gray-500);font-size:0.88rem;">No questions yet. Click + Add Question above.</p>';
  }
  return les.quiz.questions.map((q, qi) => `
    <div class="quiz-q-editor" id="qqed-${q.id}">
      <div class="quiz-q-header">
        <span class="quiz-q-label">Question ${qi + 1}</span>
        <button class="icon-btn del" onclick="deleteQuestion('${mod.id}','${les.id}','${q.id}')">🗑</button>
      </div>
      <div class="form-group">
        <label>Question Text</label>
        <textarea class="form-control" rows="2" oninput="patchQuestion('${mod.id}','${les.id}','${q.id}','question',this.value)">${esc(q.question)}</textarea>
      </div>
      <div class="form-group">
        <label>Answer Options <span style="font-weight:400;color:var(--gray-500)">(tick the correct one)</span></label>
        ${q.options.map((opt, oi) => `
          <div class="quiz-option-row">
            <label>${'ABCD'[oi]}</label>
            <input type="radio" class="correct-radio" name="correct-${q.id}" value="${oi}" ${q.correct === oi ? 'checked' : ''}
              onchange="patchQuestion('${mod.id}','${les.id}','${q.id}','correct',${oi})" />
            <input type="text" class="form-control" value="${esc(opt)}"
              oninput="patchQuestionOption('${mod.id}','${les.id}','${q.id}',${oi},this.value)" />
          </div>
        `).join('')}
      </div>
      <div class="form-group">
        <label>Explanation (shown after answering)</label>
        <textarea class="form-control" rows="2" oninput="patchQuestion('${mod.id}','${les.id}','${q.id}','explanation',this.value)">${esc(q.explanation || '')}</textarea>
      </div>
    </div>
  `).join('');
}

function addQuestion(modId, lesId) {
  const les = course.modules.find(m => m.id === modId).lessons.find(l => l.id === lesId);
  if (!les.quiz) les.quiz = { questions: [] };
  les.quiz.questions.push({
    id: uid(),
    question: 'New question',
    type: 'multiple-choice',
    options: ['Option A', 'Option B', 'Option C', 'Option D'],
    correct: 0,
    explanation: ''
  });
  markDirty();
  const mod = course.modules.find(m => m.id === modId);
  document.getElementById('quiz-editor-' + lesId).innerHTML = renderQuizEditor(mod, les);
}

function patchQuestion(modId, lesId, qId, field, value) {
  const les = course.modules.find(m => m.id === modId).lessons.find(l => l.id === lesId);
  const q = les.quiz.questions.find(x => x.id === qId);
  if (q) { q[field] = field === 'correct' ? Number(value) : value; markDirty(); }
}

function patchQuestionOption(modId, lesId, qId, optIdx, value) {
  const les = course.modules.find(m => m.id === modId).lessons.find(l => l.id === lesId);
  const q = les.quiz.questions.find(x => x.id === qId);
  if (q) { q.options[optIdx] = value; markDirty(); }
}

function deleteQuestion(modId, lesId, qId) {
  const les = course.modules.find(m => m.id === modId).lessons.find(l => l.id === lesId);
  les.quiz.questions = les.quiz.questions.filter(q => q.id !== qId);
  markDirty();
  const mod = course.modules.find(m => m.id === modId);
  document.getElementById('quiz-editor-' + lesId).innerHTML = renderQuizEditor(mod, les);
}

/* ── Add / Delete Module & Lesson ────────────────────────────── */

function addModule() {
  const mod = {
    id: uid(),
    title: 'New Module',
    description: '',
    order: course.modules.length + 1,
    wheelSpokes: [],
    lessons: []
  };
  course.modules.push(mod);
  markDirty();
  renderLeft();
  editModule(mod.id);
}

function deleteModule(modId) {
  if (!confirm('Delete this module and all its lessons? This cannot be undone.')) return;
  course.modules = course.modules.filter(m => m.id !== modId);
  markDirty();
  renderLeft();
  editCourseInfo();
}

function addLesson(modId) {
  const mod = course.modules.find(m => m.id === modId);
  const les = {
    id: uid(),
    title: 'New Lesson',
    description: '',
    youtubeId: '',
    notes: '',
    resources: [],
    wheelSpokes: [],
    quiz: { questions: [] }
  };
  mod.lessons.push(les);
  markDirty();
  renderLeft();
  editLesson(modId, les.id);
}

function deleteLesson(modId, lesId) {
  if (!confirm('Delete this lesson?')) return;
  const mod = course.modules.find(m => m.id === modId);
  mod.lessons = mod.lessons.filter(l => l.id !== lesId);
  markDirty();
  renderLeft();
  editModule(modId);
}

/* ── Modal helpers ───────────────────────────────────────────── */

function closeModal(event) {
  document.getElementById('modal-overlay').style.display = 'none';
}

/* ── Toast ───────────────────────────────────────────────────── */

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  setTimeout(() => { t.className = type; }, 2800);
}

/* ── Helpers ─────────────────────────────────────────────────── */

function uid() {
  return 'id-' + Math.random().toString(36).slice(2, 9) + '-' + Date.now().toString(36);
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Warn on unsaved changes
window.addEventListener('beforeunload', e => {
  if (isDirty) { e.preventDefault(); e.returnValue = ''; }
});

init();
</script>
</body>
</html>
